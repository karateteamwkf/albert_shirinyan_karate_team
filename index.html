<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-armenian@5.0.0/index.css">
<style>
:root{--bg:#22333b;--text:#0a0908;--frame:#eae0d5}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--frame);font-family:'Inter','Noto Sans Armenian',sans-serif;overflow-x:hidden}
.frame-card{background:var(--frame);color:var(--text);border-radius:20px;padding:2rem;box-shadow:0 15px 50px rgba(0,0,0,.35)}
.nav-link{position:relative;transition:color .3s;cursor:pointer}
.nav-link::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--frame);transition:width .3s}
.nav-link:hover::after{width:100%}
.lang-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;transition:all .3s;cursor:pointer;font-size:13px;font-weight:700;background:transparent;border:1px solid transparent;color:var(--frame)}
.lang-btn:hover{background:rgba(234,224,213,.1)}
.lang-btn.active{background:var(--frame);color:var(--text);border-color:var(--frame)}
.flag{width:22px;height:15px;border-radius:3px;display:inline-block;overflow:hidden;flex-shrink:0;position:relative}
.uk-flag{background:#012169;overflow:hidden;border-radius:2px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.2)}
.uk-flag svg{width:100%;height:100%;display:block}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-image:url('https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744512_121.jpg?v=1792232409');background-size:cover;background-position:center;filter:brightness(.5);transform:scale(1.05);animation:heroZoom 20s ease-in-out infinite alternate}
@keyframes heroZoom{0%{transform:scale(1.05)}100%{transform:scale(1.15)}}
.hero-content{position:relative;z-index:2;text-align:center;padding:2rem}
.hero-title{font-size:clamp(2.2rem,6vw,4.8rem);font-weight:900;letter-spacing:2px;color:var(--frame);text-shadow:0 4px 25px rgba(0,0,0,.7);line-height:1.1;font-family:'Courier New',monospace;min-height:2.4em}
.hero-subtitle{font-size:clamp(.9rem,1.8vw,1.3rem);color:var(--frame);margin-top:1rem;opacity:.9;letter-spacing:4px;text-transform:uppercase}
.reveal{opacity:0;transform:translateY(40px);transition:opacity 1s ease,transform 1s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-left{opacity:0;transform:translateX(-140px);transition:opacity 1.2s ease,transform 1.2s ease}
.reveal-left.visible{opacity:1;transform:translateX(0)}
.reveal-right{opacity:0;transform:translateX(140px);transition:opacity 1.2s ease,transform 1.2s ease}
.reveal-right.visible{opacity:1;transform:translateX(0)}
.section-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:var(--frame);margin-bottom:1.5rem;text-align:center}
.section-title::after{content:'';display:block;width:80px;height:3px;background:var(--frame);margin:1rem auto 0;border-radius:2px}
.photo-slide{border-radius:16px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.45);transition:transform .5s}
.photo-slide:hover{transform:scale(1.03)}
.photo-slide img{width:100%;height:100%;object-fit:cover;display:block}
.marquee-container{width:100%;overflow:hidden;padding:2rem 0;position:relative}
.marquee-track{display:flex;gap:2rem;animation:marquee 45s linear infinite;width:max-content}
.marquee-photo{width:180px;height:180px;border-radius:50%;overflow:hidden;border:4px solid var(--frame);box-shadow:0 8px 25px rgba(0,0,0,.5);flex-shrink:0;animation:pulse 3.5s ease-in-out infinite}
.marquee-photo img{width:100%;height:100%;object-fit:cover}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.map-icon{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--frame);color:var(--text);border-radius:12px;cursor:pointer;transition:all .3s;text-decoration:none;font-weight:700;font-size:14px;margin-top:1rem}
.map-icon:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(234,224,213,.35)}
.phone-link{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;background:var(--frame);color:var(--text);border-radius:14px;text-decoration:none;font-weight:700;font-size:1.05rem;transition:all .3s;margin:8px}
.phone-link:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(234,224,213,.4)}
.phone-icon{animation:sparkle 1.5s ease-in-out infinite;display:inline-block}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(-12deg)}}
.msg-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:14px;text-decoration:none;font-weight:700;transition:all .3s;color:#fff;min-width:180px;justify-content:center;font-size:1rem}
.msg-btn:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.msg-whatsapp{background:#25D366}
.msg-viber{background:#7360F2}
.msg-telegram{background:#0088cc}
.qr-card{background:var(--frame);color:var(--text);padding:2rem;border-radius:22px;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.35)}
.qr-card img{width:220px;height:220px;object-fit:contain;border-radius:12px;margin:1rem auto;display:block}
.footer{background:transparent;padding:3rem 2rem 2rem;text-align:center;border-top:1px solid rgba(234,224,213,.15)}
.footer-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--frame);margin:0 auto 1.5rem;animation:sparkleLogo 2s ease-in-out infinite}
@keyframes sparkleLogo{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}50%{transform:scale(1.05);filter:drop-shadow(0 0 15px rgba(234,224,213,.6))}}
.footer-sub{color:var(--frame);opacity:.85;font-size:1rem;margin-top:1rem;font-weight:500}
.mobile-menu{display:none;position:fixed;top:72px;left:0;right:0;background:rgba(34,51,59,.98);backdrop-filter:blur(10px);padding:1.5rem;border-bottom:1px solid rgba(234,224,213,.2);z-index:99;flex-direction:column;gap:1rem}
.mobile-menu.open{display:flex}
.hamburger{display:none;cursor:pointer;flex-direction:column;gap:5px}
.hamburger span{width:26px;height:3px;background:var(--frame);border-radius:2px;transition:.3s}
@media(max-width:900px){
.desktop-nav{display:none !important}
.hamburger{display:flex}
.marquee-photo{width:140px;height:140px}
.frame-card{padding:1.5rem}
.hero-title{font-size:clamp(1.8rem,8vw,3rem)}
.qr-card img{width:180px;height:180px}
}
.feature-list{list-style:none;padding:0}
.feature-list li{padding:1rem 0;border-bottom:1px solid rgba(10,9,8,.12);display:flex;gap:14px;align-items:flex-start}
.feature-list li:last-child{border-bottom:none}
.feature-list .bullet{flex-shrink:0;width:30px;height:30px;background:var(--text);color:var(--frame);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.video-wrap{border-radius:16px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.45)}
.video-wrap video{width:100%;display:block}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--frame);border-radius:5px}
.qr-slide-left{opacity:0;transform:translateX(-150px);transition:all 1.3s ease}
.qr-slide-right{opacity:0;transform:translateX(150px);transition:all 1.3s ease}
.qr-slide-left.visible,.qr-slide-right.visible{opacity:1;transform:translateX(0)}
.sub-heading{font-size:1.4rem;font-weight:800;color:var(--text);margin:1.5rem 0 .8rem;border-left:4px solid var(--text);padding-left:12px}
.address-card{background:var(--frame);color:var(--text);padding:1.8rem;border-radius:16px;margin-bottom:1.2rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logo-link{cursor:pointer;transition:transform .3s}
.logo-link:hover{transform:scale(1.05)}
</style>
</head>

about_coach_p1:"Ակումբի հիմնադիր և գլխավոր մարզիչ Ալբերտ Շիրինյանը մինչ մարզչական կարիերան սկսելը, եղել է բարձրակարգ մարզիկ և Հայաստանի կարատեի ազգային հավաքականի անդամ։ Նա ՀՀ բազմակի չեմպիոն է, ինչպես նաև միջազգային հեղինակավոր մրցաշարերի հաղթող ու մրցանակակիր։",
about_coach_p2:"2020 թվականից անցնելով մարզչական գործունեության՝ Ալբերտ Շիրինյանը կարճ ժամանակահատվածում գրանցեց տպավորիչ հաջողություններ. նրա սաները բարձր արդյունքներ են ցուցադրում ինչպես Հայաստանում, այնպես էլ նրա սահմաններից դուրս։",
about_coach_p3:"Ցուցաբերած բարձր պրոֆեսիոնալիզմի շնորհիվ՝ Ֆեդերացիայի նախագահ Վազգեն Հարությունյանի հրամանով Ալբերտ Շիրինյանը նշանակվել է գլխավոր մարզիչի՝ Սերոժյա Մակարյանի օգնական՝ Հայաստանի Ազգային Հավաքականի ավագ մարզիչ։",
about_coach_p4:"Այժմ մարզիչն իր ակտիվ մասնակցությունն ունի ազգային հավաքականի նախապատրաստական աշխատանքներում, քանի որ «2027 թվականի Եվրոպայի Առաջնությունը» հյուրընկալելու է մեր հայրենիքը՝ ընդունելով ավելի քան 50 երկրների մարզիկների, մարզիչների և մրցավարների։",

let currentLang='hy';
let heroDecodeStarted=false;
function setLang(lang){
currentLang=lang;
document.documentElement.lang=lang==='hy'?'hy':lang==='ru'?'ru':'en';
document.querySelectorAll('.lang-btn').forEach(btn=>{btn.classList.toggle('active',btn.dataset.lang===lang)});
document.querySelectorAll('[data-i18n]').forEach(el=>{
const key=el.dataset.i18n;
if(translations[lang]&&translations[lang][key]){el.textContent=translations[lang][key]}
});
updateMapLinks();
if(!heroDecodeStarted){
heroDecodeStarted=true;
runHeroDecode();
}
}
function updateMapLinks(){
const addr1="Grigor Lusavorchich 7, Yerevan, Armenia";
const addr2="Tigran Mets Ave 26a, Yerevan, Armenia";
const langMap={hy:'hy',en:'en',ru:'ru'};
document.getElementById('mapLink1').href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr1)}&hl=${langMap[currentLang]}`;
document.getElementById('mapLink2').href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr2)}&hl=${langMap[currentLang]}`;
}

const spinPhotos=['https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744506_121.jpg?v=1792232446','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744504_121.jpg?v=1792232446','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744503_121.jpg?v=1792232446','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744500_121.jpg?v=1792232446','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744501_121.jpg?v=1792232446','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744511_121.jpg?v=1792232409','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744508_121.jpg?v=1792232409','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744507_121.jpg?v=1792232409','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744509_121.jpg?v=1792232409','https://cdn.shopify.com/s/files/1/0681/9050/2974/files/5375229877247744514_121.jpg?v=1792232343'];

function buildMarquee(){
const track=document.getElementById('marqueeTrack');
const allPhotos=[...spinPhotos,...spinPhotos];
allPhotos.forEach((src,i)=>{
const photo=document.createElement('div');
photo.className='marquee-photo';
photo.style.animationDelay=(i*0.35)+'s';
photo.innerHTML=`<img src="${src}" alt="">`;
track.appendChild(photo);
});
}

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('visible');
}else{
if(entry.target.classList.contains('reveal-left')||entry.target.classList.contains('reveal-right')||entry.target.classList.contains('qr-slide-left')||entry.target.classList.contains('qr-slide-right')){
entry.target.classList.remove('visible');
}
}
});
},{threshold:0.15});

document.addEventListener('DOMContentLoaded',()=>{
document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.qr-slide-left,.qr-slide-right').forEach(el=>{observer.observe(el)});
buildMarquee();
setLang('hy');
});

function runHeroDecode(){
const el=document.getElementById('heroTitle');
const finalText='ALBERT SHIRINYAN\nKARATE TEAM WKF';
const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%';
let iteration=0;
const interval=setInterval(()=>{
el.innerHTML=finalText.split('').map((char,idx)=>{
if(idx<iteration)return char==='\n'?'<br>':char;
if(char==='\n')return'<br>';
if(char===' ')return' ';
return chars[Math.floor(Math.random()*chars.length)];
}).join('');
if(iteration>=finalText.length){
clearInterval(interval);
}
iteration+=1;
},25);
}
</script>
